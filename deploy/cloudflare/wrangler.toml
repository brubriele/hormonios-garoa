# spec-6 A2
name = "hormonios-cronjob"
main = "cronjob.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# spec-6 A6
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# spec-6 A3
[triggers]
crons = ["*/5 * * * *", "1-59/5 * * * *", "2-59/5 * * * *"]

# spec-6 B1: o bundle usa as dependências deste pacote, não as da raiz
[alias]
"zod" = "./node_modules/zod"
"@supabase/supabase-js" = "./node_modules/@supabase/supabase-js"
